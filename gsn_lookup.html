<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSN Quick Lookup | Baltimore Ravens</title>
<style>
  :root {
    --purple: #24135F;
    --gold: #9A7611;
    --gold-light: #C9A227;
    --bg: #F7F6FC;
    --white: #FFFFFF;
    --border: #DDD8F0;
    --text: #1A1A2E;
    --muted: #777;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--purple);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left h1 { color: var(--white); font-size: 1.25rem; font-weight: 700; }
  .header-left p  { color: var(--gold-light); font-size: 0.75rem; margin-top: 2px; }
  .nav-link {
    color: var(--gold-light);
    font-size: 0.8rem;
    text-decoration: none;
    border: 1px solid var(--gold);
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .nav-link:hover { background: var(--gold); color: var(--white); }

  /* ── SEARCH ── */
  .search-section {
    background: var(--white);
    border-bottom: 2px solid var(--border);
    padding: 28px 24px 20px;
  }
  .search-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .search-wrap {
    display: flex;
    gap: 10px;
    max-width: 600px;
  }
  #searchInput {
    flex: 1;
    font-size: 1.3rem;
    padding: 12px 18px;
    border: 2.5px solid var(--purple);
    border-radius: 10px;
    outline: none;
    color: var(--text);
    background: var(--white);
  }
  #searchInput:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(154,118,17,0.15); }
  #clearBtn {
    padding: 12px 18px;
    background: var(--border);
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
    color: var(--muted);
  }
  #clearBtn:hover { background: #c9c4e0; }

  /* ── ARTIST LIST (empty state) ── */
  .artist-list {
    padding: 20px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-width: 900px;
  }
  .artist-chip {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.8rem;
    cursor: pointer;
    color: var(--purple);
    transition: all 0.15s;
  }
  .artist-chip:hover { background: var(--purple); color: var(--white); border-color: var(--purple); }
  .artist-chip.mt-bank { border-color: var(--gold); background: #FFF9EC; }
  .artist-chip.mt-bank:hover { background: var(--gold); color: var(--white); }

  /* ── RESULTS AREA ── */
  #results { padding: 24px; }

  .artist-title {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--purple);
    margin-bottom: 4px;
  }
  .artist-subtitle {
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .mt-badge {
    display: inline-block;
    background: var(--gold);
    color: var(--white);
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 12px;
    margin-left: 10px;
    vertical-align: middle;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── KPI GRID ── */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--white);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .kpi-card.highlight {
    background: var(--purple);
    border-color: var(--purple);
  }
  .kpi-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .kpi-card.highlight .kpi-label { color: var(--gold-light); }
  .kpi-value {
    font-size: 1.65rem;
    font-weight: 800;
    color: var(--purple);
    line-height: 1.1;
  }
  .kpi-card.highlight .kpi-value { color: var(--white); font-size: 1.9rem; }
  .kpi-sub {
    font-size: 0.75rem;
    color: var(--gold);
    margin-top: 4px;
    font-weight: 600;
  }
  .kpi-card.highlight .kpi-sub { color: rgba(255,255,255,0.65); }

  /* Revenue calc note */
  .calc-note {
    background: #FFF9EC;
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.78rem;
    color: #5A3E00;
    margin-bottom: 20px;
  }

  /* ── SHOW TABLE ── */
  .table-section { margin-top: 8px; }
  .table-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 700;
  }
  .show-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
    background: var(--white);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(36,19,95,0.08);
  }
  .show-table th {
    background: var(--purple);
    color: var(--white);
    padding: 10px 14px;
    text-align: left;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
  }
  .show-table td {
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .show-table tr:last-child td { border-bottom: none; }
  .show-table tr:nth-child(even) td { background: var(--bg); }
  .final-tag {
    display: inline-block;
    background: #E8F5E9;
    color: #2E7D32;
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 0.7rem;
    font-weight: 700;
  }
  .pending-tag {
    display: inline-block;
    background: #FFF8E1;
    color: #F57F17;
    border-radius: 10px;
    padding: 2px 8px;
    font-size: 0.7rem;
    font-weight: 700;
  }

  /* ── PDF BUTTON ── */
  .pdf-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--purple);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 10px 22px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 20px;
    text-decoration: none;
  }
  .pdf-btn:hover { background: var(--gold); }

  /* ── NO RESULT ── */
  .no-result {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .no-result .emoji { font-size: 3rem; margin-bottom: 12px; }
  .no-result h3 { color: var(--purple); margin-bottom: 6px; }

  /* ── PRINT ── */
  @media print {
    .header .nav-link, .pdf-btn, #clearBtn, .search-section { display: none !important; }
    body { background: white; }
    .kpi-card { border: 1px solid #ccc !important; }
  }
  @media (max-width: 600px) {
    /* Layout */
    #results { padding: 14px; }
    .search-section { padding: 16px; }
    .artist-list { padding: 12px 14px; gap: 8px; }

    /* Larger tap targets on artist chips */
    .artist-chip {
      padding: 10px 16px;
      font-size: 0.9rem;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
    }

    /* KPI: 2-column */
    .kpi-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi-card { padding: 12px 14px; }
    .kpi-value { font-size: 1.3rem; }
    .kpi-card.highlight .kpi-value { font-size: 1.55rem; }
    .kpi-label { font-size: 0.65rem; }

    /* Show table: horizontal scroll */
    .table-section { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .show-table { min-width: 560px; }

    /* Artist title */
    .artist-title { font-size: 1.3rem; }

    /* Header */
    .header { padding: 10px 14px; }
    .header-left h1 { font-size: 1.1rem; }
  }
</style>
</head>

const MT_BANK_ARTISTS = [
  'DC UNITED / INTER MIAMI', 'MORGAN WALLEN', 'BTS WORLD TOUR'
];
const MT_UPCOMING = [
  'SPRINGBOKS VS ALL BLACKS', 'MEXICO VS COLOMBIA', 'USHER/CHRIS BROWN'
];

function fmt$(n) {
  if (n == null || isNaN(n)) return '—';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  return '$' + Math.round(n).toLocaleString();
}
function fmtFull$(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtN(n) {
  if (n == null || isNaN(n) || n === 0) return '—';
  return Math.round(n).toLocaleString();
}
function fmtATP(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + n.toFixed(2);
}

// Build artist chips
const artistList = document.getElementById('artistList');
GSN_DATA.forEach(a => {
  const chip = document.createElement('span');
  chip.className = 'artist-chip' + (MT_BANK_ARTISTS.includes(a.artist) ? ' mt-bank' : '');
  chip.textContent = a.artist;
  chip.onclick = () => {
    document.getElementById('searchInput').value = a.artist;
    runSearch(a.artist);
    document.getElementById('artistList').style.display = 'none';
  };
  artistList.appendChild(chip);
});

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim();
  if (q.length === 0) {
    clearSearch();
    return;
  }
  artistList.style.display = 'none';
  runSearch(q);
});

function clearSearch() {
  document.getElementById('searchInput').value = '';
  document.getElementById('results').innerHTML = '';
  document.getElementById('artistList').style.display = 'flex';
}

function runSearch(query) {
  const q = query.toUpperCase();
  const matches = GSN_DATA.filter(a => a.artist.toUpperCase().includes(q));
  const res = document.getElementById('results');

  if (matches.length === 0) {
    res.innerHTML = `<div class="no-result">
      <div class="emoji">🔍</div>
      <h3>No results for "${query}"</h3>
      <p>Try a partial name — e.g. "Usher", "Bruno", "BTS"</p>
    </div>`;
    return;
  }

  const artist = matches[0]; // show top match
  const isMT = MT_BANK_ARTISTS.includes(artist.artist);
  const isUpcoming = MT_UPCOMING.some(u => artist.artist.toUpperCase().includes(u.split(' ')[0]));
  const mtBadge = isMT ? '<span class="mt-badge">✅ M&T Bank</span>' : 
                  isUpcoming ? '<span class="mt-badge" style="background:#2E7D32">📅 Upcoming M&T</span>' : '';

  // Per-night averages for context
  const avgTix = Math.round(artist.total_tickets / artist.total_nights);
  const avgGross = artist.avg_gross;

  const showRows = artist.shows.filter(s => s.tickets != null).map(s => {
    const tag = s.is_final
      ? '<span class="final-tag">✓ Final</span>'
      : '<span class="pending-tag">Pending</span>';
    const d1 = s.day1_tickets ? fmtN(s.day1_tickets) : '—';
    const d1g = s.day1_gross ? fmt$(s.day1_gross) : '—';
    return `<tr>
      <td>${s.city}</td>
      <td>${s.date}</td>
      <td>${fmtN(s.tickets)}</td>
      <td>${fmtATP(s.atp)}</td>
      <td>${d1}</td>
      <td>${d1g}</td>
      <td>${fmt$(s.gross)}</td>
      <td>${fmt$(s.ravens_rev)}</td>
      <td>${tag}</td>
    </tr>`;
  }).join('');

  // Ravens revenue calc
  const ravShare = artist.ravens_revenue;
  const ravPerNight = ravShare / artist.total_nights;

  res.innerHTML = `
    <div class="artist-title">${artist.artist}${mtBadge}</div>
    <div class="artist-subtitle">${artist.total_nights} show nights · ${artist.completed_nights} completed (Final) · GSN Rank #${GSN_DATA.findIndex(a=>a.artist===artist.artist)+1} by Gross</div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total Tickets Sold</div>
        <div class="kpi-value">${fmtN(artist.total_tickets)}</div>
        <div class="kpi-sub">Avg ${fmtN(avgTix)} / night</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg Ticket Price (ATP)</div>
        <div class="kpi-value">${fmtATP(artist.atp)}</div>
        <div class="kpi-sub">Total gross ÷ tickets sold</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Day 1 On-Sale Tickets</div>
        <div class="kpi-value">${fmtN(artist.total_day1_tickets) !== '—' ? fmtN(artist.total_day1_tickets) : '—'}</div>
        <div class="kpi-sub">Day 1 Gross: ${fmt$(artist.total_day1_gross || 0)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Presale Tickets</div>
        <div class="kpi-value">${fmtN(artist.total_presale_tickets) !== '—' ? fmtN(artist.total_presale_tickets) : '—'}</div>
        <div class="kpi-sub">Gross: ${fmt$(artist.total_presale_gross || 0)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Gross Revenue</div>
        <div class="kpi-value">${fmt$(artist.total_gross)}</div>
        <div class="kpi-sub">Avg ${fmt$(avgGross)} / night</div>
      </div>
      <div class="kpi-card highlight">
        <div class="kpi-label">Ravens Revenue (8%)</div>
        <div class="kpi-value">${fmt$(ravShare)}</div>
        <div class="kpi-sub">≈ ${fmt$(ravPerNight)} per night · 30% × 24.8%</div>
      </div>
    </div>

    <div class="calc-note">
      📱 <strong>Quick Calc:</strong> ${fmtN(avgTix)} avg tickets × ${fmtATP(artist.atp)} ATP = ${fmt$(avgGross)} avg gross/night × 8% = <strong>${fmt$(ravPerNight)} Ravens revenue per night</strong>
    </div>

    ${showRows ? `
    <div class="table-section">
      <div class="table-title">Show-by-Show Breakdown</div>
      <div style="overflow-x:auto">
      <table class="show-table">
        <thead><tr>
          <th>City</th><th>Date</th><th>Tickets Sold</th><th>ATP</th>
          <th>Day 1 Tickets</th><th>Day 1 Gross</th><th>Total Gross</th><th>Ravens Rev (8%)</th><th>Status</th>
        </tr></thead>
        <tbody>${showRows}</tbody>
      </table>
      </div>
    </div>` : ''}

    ${matches.length > 1 ? `<p style="margin-top:16px;font-size:0.82rem;color:var(--muted);">Also matched: ${matches.slice(1).map(a=>`<strong>${a.artist}</strong>`).join(', ')} — type more to narrow results.</p>` : ''}

    <button class="pdf-btn" onclick="window.print()">⬇️ Print / Save as PDF</button>
  `;
}

// Auto-focus search on load
document.getElementById('searchInput').focus();
</script>
